version: '3.8'

services:
  hermes-dashboard:
    build: .
    ports:
      - "3000:3000"
    environment:
      HERMES_HOME: /opt/data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./data:/opt/data
      - ./dashboard:/app/dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
